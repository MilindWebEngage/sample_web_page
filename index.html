<html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebEngage App Connector</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .container {
        background: white;
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        text-align: center;
        max-width: 400px;
        width: 100%;
      }
      .logo {
        font-size: 48px;
        margin-bottom: 20px;
      }
      h1 {
        color: #333;
        margin-bottom: 10px;
        font-size: 24px;
      }
      .subtitle {
        color: #666;
        margin-bottom: 30px;
        font-size: 14px;
      }
      .connect-btn {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        padding: 16px 32px;
        border-radius: 50px;
        font-size: 18px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
        width: 100%;
        margin-bottom: 20px;
      }
      .connect-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
      }
      .connect-btn:active {
        transform: translateY(0);
      }
      .stop-btn {
        background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
        color: white;
        border: none;
        padding: 16px 32px;
        border-radius: 50px;
        font-size: 18px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
        width: 100%;
        margin-bottom: 20px;
      }
      .stop-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(231, 76, 60, 0.3);
      }
      .stop-btn:active {
        transform: translateY(0);
      }
      .platform-info {
        background: #f8f9fa;
        padding: 15px;
        border-radius: 10px;
        margin-top: 20px;
        font-size: 12px;
        color: #666;
      }
      .error {
        color: #e74c3c;
        margin-top: 15px;
        font-size: 14px;
      }
      .error-container {
        background: #fdf2f2;
        border: 2px solid #e74c3c;
        border-radius: 10px;
        padding: 20px;
        margin-top: 20px;
        display: none;
      }
      .error-icon {
        font-size: 32px;
        margin-bottom: 10px;
      }
      .error-title {
        color: #e74c3c;
        font-weight: 600;
        margin-bottom: 8px;
      }
      .error-message {
        color: #c0392b;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo">📱</div>
      <h1>Connect to WebEngage Inspector</h1>
      <p class="subtitle">Tap the button below to open the your app</p>

      <button class="connect-btn" onclick="connectToApp()" style="display: none;">🚀 Open App</button>

      <button class="stop-btn" id="stopBtn" onclick="stopDataPass()" style="display: none;">🛑 Stop</button>

      <div id="error" class="error" style="display: none"></div>

      <div id="errorContainer" class="error-container" style="display: block;">
        <div class="error-icon">⚠️</div>
        <div class="error-title">Connection Error</div>
        <div id="errorMessage" class="error-message">Missing data or platform parameter. Please ensure both 'data' and 'platform' parameters are provided in the URL.</div>
      </div>
    </div>

    <script>
      let platform = "";
      let data = "";

      // Parse URL parameters
      function parseParams() {
        const urlParams = new URLSearchParams(window.location.search);
        data = urlParams.get("data") || "";
        platform = urlParams.get("platform") || "";

        if (!data || !platform) {
          showErrorContainer(
            "Missing data or platform parameter. Please ensure both 'data' and 'platform' parameters are provided in the URL."
          );
        } else {
          // Show both buttons when params are valid
          document.querySelector(".connect-btn").style.display = "block";
          document.getElementById("stopBtn").style.display = "block";
          document.getElementById("errorContainer").style.display = "none";
        }
      }

      function connectToApp() {
        if (!data || !platform) {
          showErrorContainer("Missing required parameters");
          return;
        }

        let intentUrl = "";

        if (platform === "android") {
          intentUrl = `intent://inspector?data=${encodeURIComponent(
            data
          )}#Intent;scheme=webengage-inspector;end`;
        } else if (platform === "ios") {
          intentUrl = `webengage-inspector://inspector?data=${encodeURIComponent(
            data
          )}`;
        } else if (platform === "web") {
          // For web, could redirect to a web app or show instructions
          showError("Web platform not supported for app opening");
          return;
        } else {
          showError("Unsupported platform: " + platform);
          return;
        }

        // Try to open the app
        window.location.href = intentUrl;
      }

      function showError(message) {
        const error = document.getElementById("error");
        error.textContent = message;
        error.style.display = "block";
      }

      function showErrorContainer(message) {
        const errorContainer = document.getElementById("errorContainer");
        const errorMessage = document.getElementById("errorMessage");
        errorMessage.textContent = message;
        errorContainer.style.display = "block";

        // Hide both buttons when showing error
        document.querySelector(".connect-btn").style.display = "none";
        document.getElementById("stopBtn").style.display = "none";
      }

      // Initialize on page load
      document.addEventListener("DOMContentLoaded", parseParams);

      function stopDataPass() {
        if (!platform) {
          showErrorContainer("Missing platform parameter. Cannot send stop signal.");
          return;
        }

        let intentUrl = "";

        if (platform === "android") {
          intentUrl = `intent://inspector?data=${encodeURIComponent(
            "stop"
          )}#Intent;scheme=webengage-inspector;end`;
        } else if (platform === "ios") {
          intentUrl = `webengage-inspector://inspector?data=${encodeURIComponent(
            "stop"
          )}`;
        } else {
          showError("Unsupported platform: " + platform);
          return;
        }

        // Pass data=stop to the app
        window.location.href = intentUrl;
      }
    </script>
  

</body></html>
