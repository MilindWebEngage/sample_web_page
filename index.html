
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebEngage Inspector 2</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 90%;
      max-width: 500px;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      text-align: center;
      box-sizing: border-box;
    }

    h1 {
      margin-top: 0;
      color: #333;
    }

    p {
      color: #666;
      line-height: 1.5;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .connect-btn {
      background: #007bff;
      color: white;
      display: none;
    }

    .stop-btn {
      background: #dc3545;
      color: white;
      display: none;
    }

    .error-container {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      background: #f8d7da;
      color: #721c24;
    }

    .error {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      background: #fff3cd;
      color: #856404;
    }

    .details {
      display: none;
      text-align: left;
      margin-top: 20px;
      padding: 15px;
      background: #f8f9fa;
      border-radius: 8px;
      word-break: break-all;
    }

    .details strong {
      color: #333;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>WebEngage Inspector</h1>

    <p>
      Connect this browser page to the WebEngage Inspector app.
    </p>

    <div id="details" class="details">
      <div>
        <strong>Platform:</strong>
        <span id="platformValue"></span>
      </div>

      <div style="margin-top: 10px;">
        <strong>Data:</strong>
        <span id="dataValue"></span>
      </div>

      <div style="margin-top: 10px;">
        <strong>Token:</strong>
        <span id="tokenValue"></span>
      </div>
    </div>

    <button
      class="connect-btn"
      onclick="connectToApp()"
    >
      Connect to App2
    </button>

    <button
      id="stopBtn"
      class="stop-btn"
      onclick="stopDataPass()"
    >
      Stop
    </button>

    <div id="errorContainer" class="error-container">
      <span id="errorMessage"></span>
    </div>

    <div id="error" class="error"></div>
  </div>

  <script>
    let platform = "";
    let data = "";
    let token = "";

    // Parse URL parameters
    function parseParams() {
      const urlParams = new URLSearchParams(window.location.search);

      data = urlParams.get("data") || "";
      token = urlParams.get("token") || "";
      platform = urlParams.get("platform") || "";

      if (!data || !token || !platform) {
        showErrorContainer(
          "Missing data, token, or platform parameter. Please ensure all required parameters are provided in the URL."
        );
        return;
      }

      // Show parsed values
      document.getElementById("platformValue").textContent = platform;
      document.getElementById("dataValue").textContent = data;
      document.getElementById("tokenValue").textContent = token;

      document.getElementById("details").style.display = "block";

      // Show buttons when params are valid
      document.querySelector(".connect-btn").style.display = "block";
      document.getElementById("stopBtn").style.display = "block";
      document.getElementById("errorContainer").style.display = "none";
    }

    function connectToApp() {
      if (!data || !token || !platform) {
        showErrorContainer("Missing required parameters");
        return;
      }

      let intentUrl = "";

      if (platform === "android") {

        intentUrl =
          `intent://inspector?data=${encodeURIComponent(data)}` +
          `&token=${encodeURIComponent(token)}` +
          `#Intent;scheme=webengage-inspector;end`;

      } else if (platform === "ios") {

        intentUrl =
          `webengage-inspector://inspector?data=${encodeURIComponent(data)}` +
          `&token=${encodeURIComponent(token)}`;

      } else if (platform === "web") {

        showError("Web platform not supported for app opening");
        return;

      } else {

        showError("Unsupported platform: " + platform);
        return;
      }

      console.log("Opening app with URL:", intentUrl);

      // Try to open the app
      window.location.href = intentUrl;
    }

    function showError(message) {
      const error = document.getElementById("error");

      error.textContent = message;
      error.style.display = "block";
    }

    function showErrorContainer(message) {
      const errorContainer =
        document.getElementById("errorContainer");

      const errorMessage =
        document.getElementById("errorMessage");

      errorMessage.textContent = message;
      errorContainer.style.display = "block";

      // Hide buttons
      document.querySelector(".connect-btn").style.display = "none";
      document.getElementById("stopBtn").style.display = "none";

      // Hide details
      document.getElementById("details").style.display = "none";
    }

    function stopDataPass() {
      if (!platform) {
        showErrorContainer(
          "Missing platform parameter. Cannot send stop signal."
        );
        return;
      }

      let intentUrl = "";

      if (platform === "android") {

        intentUrl =
          `intent://inspector?data=${encodeURIComponent(
            "stop"
          )}` +
          `#Intent;scheme=webengage-inspector;end`;

      } else if (platform === "ios") {

        intentUrl =
          `webengage-inspector://inspector?data=${encodeURIComponent(
            "stop"
          )}`;

      } else {

        showError("Unsupported platform: " + platform);
        return;
      }

      console.log("Sending stop signal:", intentUrl);

      // Pass data=stop to the app
      window.location.href = intentUrl;
    }

    // Initialize on page load
    document.addEventListener(
      "DOMContentLoaded",
      parseParams
    );
  </script>

</body>
</html>
