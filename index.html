<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>WebEngage Inspector 3</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 90%;
      max-width: 500px;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      text-align: center;
      box-sizing: border-box;
    }

    h1 {
      margin-top: 0;
      color: #333;
    }

    p {
      color: #666;
      line-height: 1.5;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .connect-btn {
      background: #007bff;
      color: white;
      display: none;
    }

    .ios-test-btn {
      background: #6f42c1;
      color: white;
      display: none;
    }

    .stop-btn {
      background: #dc3545;
      color: white;
      display: none;
    }

    .error-container {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      background: #f8d7da;
      color: #721c24;
    }

    .error {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      background: #fff3cd;
      color: #856404;
    }

    .details {
      display: none;
      text-align: left;
      margin-top: 20px;
      padding: 15px;
      background: #f8f9fa;
      border-radius: 8px;
      word-break: break-all;
    }

    .detail-row {
      margin-bottom: 10px;
    }

    .detail-row:last-child {
      margin-bottom: 0;
    }

    .detail-label {
      font-weight: bold;
      color: #333;
    }

    .ios-url {
      display: none;
      margin-top: 15px;
      padding: 12px;
      background: #f1f1f1;
      border-radius: 8px;
      text-align: left;
      font-size: 13px;
      word-break: break-all;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>WebEngage Inspector</h1>

    <p>
      Connect this browser page to the WebEngage Inspector app.
    </p>

    <div id="details" class="details">

      <div class="detail-row">
        <span class="detail-label">Platform:</span>
        <span id="platformValue"></span>
      </div>

      <div
        class="detail-row"
        id="bundleIdRow"
        style="display: none;"
      >
        <span class="detail-label">Bundle ID:</span>
        <span id="bundleIdValue"></span>
      </div>

      <div class="detail-row">
        <span class="detail-label">Session ID:</span>
        <span id="sessionIdValue"></span>
      </div>

      <div class="detail-row">
        <span class="detail-label">Token:</span>
        <span id="tokenValue"></span>
      </div>

    </div>

    <button
      class="connect-btn"
      onclick="connectToApp()"
    >
      Connect to App
    </button>

    <!-- Separate iOS test button -->
    <button
      id="iosTestBtn"
      class="ios-test-btn"
      onclick="testIOSBundleScheme()"
    >
      Test iOS Bundle ID
    </button>

    <div
      id="iosUrl"
      class="ios-url"
    ></div>

    <button
      id="stopBtn"
      class="stop-btn"
      onclick="stopDataPass()"
    >
      Stop 2.2
    </button>

    <div
      id="errorContainer"
      class="error-container"
    >
      <span id="errorMessage"></span>
    </div>

    <div
      id="error"
      class="error"
    ></div>

  </div>

  <script>
    let platform = "";
    let sessionId = "";
    let token = "";
    let bundleId = "";

    // Parse URL parameters
    function parseParams() {

      const urlParams =
        new URLSearchParams(window.location.search);

      sessionId =
        urlParams.get("session_id") || "";

      token =
        urlParams.get("token") || "";

      platform =
        urlParams.get("platform") || "";

      bundleId =
        urlParams.get("bundleId") || "";

      console.log("Platform:", platform);
      console.log("Bundle ID:", bundleId);
      console.log("Session ID:", sessionId);
      console.log("Token:", token);

      if (!sessionId || !token || !platform) {

        showErrorContainer(
          "Missing session_id, token, or platform parameter. " +
          "Please ensure all required parameters are provided in the URL."
        );

        return;
      }

      // Display values
      document.getElementById(
        "platformValue"
      ).textContent = platform;

      document.getElementById(
        "sessionIdValue"
      ).textContent = sessionId;

      document.getElementById(
        "tokenValue"
      ).textContent = token;

      // Display Bundle ID only when provided
      if (bundleId) {

        document.getElementById(
          "bundleIdValue"
        ).textContent = bundleId;

        document.getElementById(
          "bundleIdRow"
        ).style.display = "block";
      }

      document.getElementById(
        "details"
      ).style.display = "block";

      // Show normal buttons
      document.querySelector(
        ".connect-btn"
      ).style.display = "block";

      document.getElementById(
        "stopBtn"
      ).style.display = "block";

      // Show separate iOS test button
      // only when bundleId is available.
      if (bundleId) {
        document.getElementById(
          "iosTestBtn"
        ).style.display = "block";
      }

      document.getElementById(
        "errorContainer"
      ).style.display = "none";
    }

    // Connect to native app
    function connectToApp() {

      if (!sessionId || !token || !platform) {

        showErrorContainer(
          "Missing required parameters"
        );

        return;
      }

      let intentUrl = "";

      var result = {
        "session_id": sessionId,
        "token": token
      };

      if (platform === "android") {

        intentUrl =
          `intent://inspector` +
          `?data=${encodeURIComponent(JSON.stringify(result))}` +
          `#Intent;` +
          `scheme=webengage-inspector;` +
          `end`;

      } else if (platform === "ios") {

        // Existing iOS flow.
        // Keep this unchanged.
        intentUrl =
          `webengage-inspector://inspector` +
          `?data=${encodeURIComponent(JSON.stringify(result))}`;

      } else if (platform === "web") {

        showError(
          "Web platform is not supported for app opening."
        );

        return;

      } else {

        showError(
          "Unsupported platform: " + platform
        );

        return;
      }

      console.log(
        "Opening app:",
        intentUrl
      );

      window.location.href = intentUrl;
    }

    // Separate iOS Bundle ID test
    function testIOSBundleScheme() {

      if (!sessionId || !token) {

        showErrorContainer(
          "Missing session_id or token parameter."
        );

        return;
      }

      if (!bundleId) {

        showError(
          "Missing bundleId parameter."
        );

        return;
      }

      var result = {
        "session_id": sessionId,
        "token": token
      };

      // New iOS scheme:
      // webengage-inspector.<bundleId>://inspector
      const iosScheme =
        `webengage-inspector.${bundleId}`;

      const intentUrl =
        `${iosScheme}://inspector` +
        `?data=${encodeURIComponent(JSON.stringify(result))}`;

      console.log(
        "Testing iOS Bundle ID scheme:",
        intentUrl
      );

      // Show URL in UI for debugging
      const iosUrl =
        document.getElementById("iosUrl");

      iosUrl.textContent =
        intentUrl;

      iosUrl.style.display =
        "block";

      // Open iOS app
      window.location.href =
        intentUrl;
    }

    // Send stop signal
    function stopDataPass() {

      if (!platform) {

        showErrorContainer(
          "Missing platform parameter. Cannot send stop signal."
        );

        return;
      }

      let intentUrl = "";

      if (platform === "android") {

        intentUrl =
          `intent://inspector` +
          `?data=stop` +
          `#Intent;` +
          `scheme=webengage-inspector;` +
          `end`;

      } else if (platform === "ios") {

        // Existing iOS stop flow.
        intentUrl =
          `webengage-inspector://inspector` +
          `?data=stop`;

      } else {

        showError(
          "Unsupported platform: " + platform
        );

        return;
      }

      console.log(
        "Sending stop signal:",
        intentUrl
      );

      window.location.href =
        intentUrl;
    }

    // Show generic error
    function showError(message) {

      const error =
        document.getElementById("error");

      error.textContent = message;
      error.style.display = "block";
    }

    // Show parameter error
    function showErrorContainer(message) {

      const errorContainer =
        document.getElementById(
          "errorContainer"
        );

      const errorMessage =
        document.getElementById(
          "errorMessage"
        );

      errorMessage.textContent =
        message;

      errorContainer.style.display =
        "block";

      // Hide buttons
      document.querySelector(
        ".connect-btn"
      ).style.display = "none";

      document.getElementById(
        "iosTestBtn"
      ).style.display = "none";

      document.getElementById(
        "stopBtn"
      ).style.display = "none";

      // Hide details
      document.getElementById(
        "details"
      ).style.display = "none";
    }

    // Initialize page
    document.addEventListener(
      "DOMContentLoaded",
      parseParams
    );
  </script>

</body>
</html>
